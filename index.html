<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HUNG KEY</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#111d40,#05070d 60%);
    color:#fff;
    font-family:Arial,sans-serif;
}

.card{
    width:100%;
    max-width:390px;
    padding:24px;
    border-radius:22px;
    background:#0b0f1b;
    border:1px solid #1d2a46;
    box-shadow:0 25px 70px #000b;
}

.logo{
    width:65px;
    height:65px;
    margin:auto;
    overflow:hidden;
    border-radius:19px;
    border:1px solid #315cff;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.title{
    margin-top:14px;
    text-align:center;
    font-size:23px;
    font-weight:bold;
}

.sub{
    margin-top:5px;
    text-align:center;
    color:#68758d;
    font-size:9px;
}

.types{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:22px;
}

.type{
    padding:16px 10px;
    border-radius:13px;
    background:#080c15;
    border:1px solid #19253b;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.type:hover{
    border-color:#315cff;
}

.type.active{
    border-color:#315cff;
    background:#0d1630;
    box-shadow:0 0 20px #315cff18;
}

.type-icon{
    font-size:23px;
}

.type-name{
    margin-top:8px;
    font-size:11px;
    font-weight:bold;
}

.type-desc{
    margin-top:4px;
    color:#68758d;
    font-size:8px;
}

#freeArea{
    display:none;
}

#freeArea.show{
    display:block;
    animation:fade .25s ease;
}

.steps{
    margin-top:15px;
}

.step{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    margin-top:9px;
    border-radius:13px;
    background:#080c15;
    border:1px solid #18243a;
    transition:.25s;
}

.step.done{
    background:#091912;
    border-color:#1d744b;
}

.icon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    flex:none;
    border-radius:11px;
    background:#111a2d;
    font-size:18px;
}

.info{
    flex:1;
}

.name{
    font-size:11px;
    font-weight:bold;
}

.desc{
    margin-top:4px;
    color:#65728a;
    font-size:8px;
}

.step-btn{
    height:34px;
    padding:0 10px;
    border:0;
    border-radius:8px;
    background:#315cff;
    color:#fff;
    font-size:8px;
    font-weight:bold;
}

.step.done .step-btn{
    background:#123b29;
    color:#68e9a4;
}

.get{
    width:100%;
    height:48px;
    margin-top:15px;
    border:0;
    border-radius:11px;
    background:#1b2435;
    color:#5e6c84;
    font-weight:bold;
    transition:.25s;
}

.get.ready{
    background:#315cff;
    color:#fff;
}

.get:disabled{
    opacity:.65;
}

.result{
    display:none;
    margin-top:13px;
    padding:13px;
    border-radius:12px;
    background:#070b13;
    border:1px solid #315cff;
}

.result.show{
    display:block;
    animation:fade .3s ease;
}

.result.expired{
    border-color:#ff526d;
}

.result-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

#timer{
    color:#82a6ff;
    font-size:10px;
    font-weight:bold;
    font-family:monospace;
}

#timer.expired{
    color:#ff6578;
}

.label{
    color:#68758e;
    font-size:8px;
}

.key{
    padding:12px;
    border-radius:9px;
    background:#10192d;
    color:#82a6ff;
    font-family:monospace;
    font-size:13px;
    text-align:center;
    word-break:break-all;
}

.copy{
    width:100%;
    height:38px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#182544;
    color:#91adff;
    font-size:9px;
}

.copy:active{
    transform:scale(.98);
}

.popup-bg{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000c;
    backdrop-filter:blur(5px);
    z-index:50;
}

.popup-bg.show{
    display:flex;
}

.popup{
    width:85%;
    max-width:330px;
    padding:22px;
    text-align:center;
    border-radius:17px;
    background:#0b101c;
    border:1px solid #315cff;
    animation:popup .25s ease;
}

.popup-icon{
    font-size:28px;
}

.popup-title{
    margin-top:9px;
    font-size:16px;
    font-weight:bold;
}

.popup-text{
    margin-top:7px;
    color:#75839c;
    font-size:9px;
    line-height:1.5;
}

.count{
    margin-top:10px;
    color:#82a6ff;
    font-size:11px;
    font-weight:bold;
}

.popup-btn{
    width:100%;
    height:39px;
    margin-top:14px;
    border:0;
    border-radius:8px;
    background:#315cff;
    color:#fff;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.88);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img src="1787140316601.png" alt="HUNG">
    </div>

    <div class="title">
        HUNG KEY
    </div>

    <div class="sub">
        CHỌN LOẠI KEY
    </div>

    <div class="types">

        <div
            id="freeType"
            class="type"
            onclick="selectFree()">

            <div class="type-icon">🔑</div>

            <div class="type-name">
                KEY FREE
            </div>

            <div class="type-desc">
                Nhận key miễn phí
            </div>

        </div>

        <div
            id="vipType"
            class="type"
            onclick="selectVip()">

            <div class="type-icon">👑</div>

            <div class="type-name">
                KEY VIP
            </div>

            <div class="type-desc">
                Liên hệ admin
            </div>

        </div>

    </div>


    <div id="freeArea">

        <div class="steps">

            <div
                id="tiktokStep"
                class="step">

                <div class="icon">🎵</div>

                <div class="info">
                    <div class="name">
                        TikTok
                    </div>

                    <div class="desc">
                        Truy cập TikTok của Hùng
                    </div>
                </div>

                <button
                    id="tiktokBtn"
                    class="step-btn"
                    onclick="openTikTok()">

                    ĐẾN TIKTOK

                </button>

            </div>


            <div
                id="zaloStep"
                class="step">

                <div class="icon">💬</div>

                <div class="info">
                    <div class="name">
                        Zalo
                    </div>

                    <div class="desc">
                        Truy cập Zalo của Hùng
                    </div>
                </div>

                <button
                    id="zaloBtn"
                    class="step-btn"
                    onclick="openZalo()">

                    ĐẾN ZALO

                </button>

            </div>

        </div>


        <button
            id="getBtn"
            class="get"
            onclick="getKey()"
            disabled>

            🔒 HOÀN THÀNH 2 BƯỚC TRƯỚC

        </button>


        <div
            id="result"
            class="result">

            <div class="result-top">

                <span id="timer">
                    02:00:00
                </span>

                <span class="label">
                    KEY FREE
                </span>

            </div>

            <div
                id="key"
                class="key">
            </div>

            <button
                id="copyBtn"
                class="copy"
                onclick="copyKey()">

                📋 SAO CHÉP KEY

            </button>

        </div>

    </div>

</div>


<div
    id="popupBg"
    class="popup-bg">

    <div class="popup">

        <div
            id="popupIcon"
            class="popup-icon">
            ✓
        </div>

        <div
            id="popupTitle"
            class="popup-title">
        </div>

        <div
            id="popupText"
            class="popup-text">
        </div>

        <div
            id="count"
            class="count">
        </div>

        <button
            class="popup-btn"
            onclick="closePopup()">

            ĐÓNG

        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyD51LwWlV5qV-RjD7HCFSqWtyucdh-V21Y",

    authDomain:
    "admin-53f18.firebaseapp.com",

    databaseURL:
    "https://admin-53f18-default-rtdb.firebaseio.com",

    projectId:
    "admin-53f18",

    storageBucket:
    "admin-53f18.firebasestorage.app",

    messagingSenderId:
    "745621699049",

    appId:
    "1:745621699049:web:3c9cef5c5b572df9987378",

    measurementId:
    "G-H7BZ2J790S"
};


const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getDatabase(app);


/* =========================
   LINKS
========================= */

const TIKTOK_URL =
    "https://www.tiktok.com/@phhung.tt?_r=1&_t=ZS-992QwGfiSjC";

const ZALO_URL =
    "https://zalo.me/0797178562";


/* =========================
   SETTINGS
========================= */

const KEY_TIME =
    2 * 60 * 60 * 1000;


/* =========================
   STATE
========================= */

let tiktokDone = false;
let zaloDone = false;

let keyTimer = null;


/* =========================
   DEVICE ID
========================= */

function getDeviceId(){

    let id =
        localStorage.getItem(
            "hung_device_id"
        );

    if(!id){

        id =
            crypto.randomUUID();

        localStorage.setItem(
            "hung_device_id",
            id
        );
    }

    return id;
}

const deviceId =
    getDeviceId();


/* =========================
   SELECT FREE
========================= */

window.selectFree =
function(){

    document
    .getElementById("freeType")
    .classList.add("active");

    document
    .getElementById("vipType")
    .classList.remove("active");

    document
    .getElementById("freeArea")
    .classList.add("show");

};


/* =========================
   SELECT VIP
========================= */

window.selectVip =
function(){

    document
    .getElementById("vipType")
    .classList.add("active");

    document
    .getElementById("freeType")
    .classList.remove("active");

    document
    .getElementById("freeArea")
    .classList.remove("show");

    showVipPopup();

};


/* =========================
   VIP POPUP
========================= */

let vipTimer = null;

function showVipPopup(){

    clearTimeout(vipTimer);

    document
    .getElementById("popupIcon")
    .textContent =
        "👑";

    document
    .getElementById("popupTitle")
    .textContent =
        "KEY VIP";

    document
    .getElementById("popupText")
    .textContent =
        "Vui lòng liên hệ Zalo admin để được hỗ trợ và nhận key VIP.";

    document
    .getElementById("count")
    .textContent =
        "Tự động chuyển hướng sau 2 giây";

    document
    .getElementById("popupBg")
    .classList.add("show");

    vipTimer =
        setTimeout(
            function(){

                window.location.href =
                    ZALO_URL;

            },
            2000
        );
}


/* =========================
   TIKTOK
========================= */

window.openTikTok =
function(){

    window.open(
        TIKTOK_URL,
        "_blank"
    );

    tiktokDone = true;

    document
    .getElementById("tiktokStep")
    .classList.add("done");

    document
    .getElementById("tiktokBtn")
    .textContent =
        "✓ ĐÃ XONG";

    updateGetButton();
};


/* =========================
   ZALO
========================= */

window.openZalo =
function(){

    window.open(
        ZALO_URL,
        "_blank"
    );

    zaloDone = true;

    document
    .getElementById("zaloStep")
    .classList.add("done");

    document
    .getElementById("zaloBtn")
    .textContent =
        "✓ ĐÃ XONG";

    updateGetButton();
};


/* =========================
   GET BUTTON STATE
========================= */

function updateGetButton(){

    const button =
        document
        .getElementById("getBtn");

    if(
        tiktokDone &&
        zaloDone
    ){

        button.disabled = false;

        button.classList.add("ready");

        button.textContent =
            "🔑 LẤY KEY";

    }
}


/* =========================
   RANDOM KEY
========================= */

function randomPart(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(
        let i = 0;
        i < 9;
        i++
    ){

        result +=
            chars[
                Math.floor(
                    Math.random()
                    * chars.length
                )
            ];

    }

    return result;
}


/* =========================
   GET KEY
========================= */

window.getKey =
async function(){

    /*
     * Kiểm tra key hiện tại
     */

    const oldKey =
        localStorage.getItem(
            "hung_current_key"
        );

    const oldExpire =
        Number(
            localStorage.getItem(
                "hung_current_expire"
            )
        );


    /*
     * Nếu vẫn còn key
     * thì không tạo key mới
     */

    if(
        oldKey &&
        oldExpire > Date.now()
    ){

        document
        .getElementById("key")
        .textContent =
            oldKey;

        showResult();

        startTimer(
            oldExpire
        );

        return;
    }


    if(
        !tiktokDone ||
        !zaloDone
    ){

        showPopup(
            "🔒",
            "CHƯA HOÀN THÀNH",
            "Vui lòng hoàn thành TikTok và Zalo trước."
        );

        return;
    }


    const now =
        Date.now();

    const key =
        "HUNG-" +
        randomPart();

    const expireAt =
        now +
        KEY_TIME;


    try{

        const keyRef =
            push(
                ref(
                    db,
                    "keys"
                )
            );


        await set(
            keyRef,
            {

                key:key,

                type:"FREE",

                active:true,

                deviceId:deviceId,

                createdAt:now,

                expireAt:expireAt,

                duration:7200,

                permissions:{

                    crosshair:true,

                    lightaim:true,

                    aimlock:false,

                    smooth:false,

                    aimdrag:false,

                    aimbody:false,

                    aimmagic:false,

                    pov:false,

                    esp:false
                }
            }
        );


        /*
         * Lưu key
         */

        localStorage.setItem(
            "hung_current_key",
            key
        );

        localStorage.setItem(
            "hung_current_expire",
            String(expireAt)
        );


        /*
         * Hiển thị key
         */

        document
        .getElementById("key")
        .textContent =
            key;


        showResult();


        /*
         * Ẩn nút lấy key
         */

        document
        .getElementById("getBtn")
        .style.display =
            "none";


        /*
         * Bắt đầu đếm
         */

        startTimer(
            expireAt
        );


        showPopup(
            "✓",
            "KEY ĐÃ KÍCH HOẠT",
            "Key FREE có thời hạn 2 giờ."
        );

    }
    catch(error){

        console.error(error);

        showPopup(
            "!",
            "LỖI SERVER",
            error.message
        );

    }
};


/* =========================
   SHOW RESULT
========================= */

function showResult(){

    document
    .getElementById("result")
    .classList.add("show");

}


/* =========================
   TIMER
========================= */

function startTimer(
    expireAt
){

    clearInterval(
        keyTimer
    );


    function updateTimer(){

        const remaining =
            expireAt -
            Date.now();


        const timer =
            document
            .getElementById("timer");


        const result =
            document
            .getElementById("result");


        if(
            remaining <= 0
        ){

            clearInterval(
                keyTimer
            );


            timer.textContent =
                "KEY ĐÃ HẾT HẠN";

            timer.classList.add(
                "expired"
            );

            result.classList.add(
                "expired"
            );


            /*
             * Không xóa key khỏi giao diện.
             * Chỉ đánh dấu hết hạn.
             */

            return;
        }


        const totalSeconds =
            Math.floor(
                remaining / 1000
            );


        const hours =
            Math.floor(
                totalSeconds / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );


        const seconds =
            totalSeconds % 60;


        timer.textContent =
            String(hours).padStart(2,"0")
            + ":"
            + String(minutes).padStart(2,"0")
            + ":"
            + String(seconds).padStart(2,"0");

    }


    updateTimer();


    keyTimer =
        setInterval(
            updateTimer,
            1000
        );
}


/* =========================
   COPY KEY
========================= */

window.copyKey =
async function(){

    const key =
        document
        .getElementById("key")
        .textContent;


    if(!key){

        return;
    }


    try{

        await navigator
            .clipboard
            .writeText(key);


        showPopup(
            "✓",
            "ĐÃ SAO CHÉP",
            "Key đã được sao chép."
        );

    }
    catch(error){

        showPopup(
            "!",
            "KHÔNG THỂ SAO CHÉP",
            "Hãy sao chép key thủ công."
        );

    }
};


/* =========================
   POPUP
========================= */

window.closePopup =
function(){

    clearTimeout(
        vipTimer
    );

    document
    .getElementById("popupBg")
    .classList.remove("show");

};


/* =========================
   RESTORE KEY
========================= */

function restoreKey(){

    const key =
        localStorage.getItem(
            "hung_current_key"
        );

    const expireAt =
        Number(
            localStorage.getItem(
                "hung_current_expire"
            )
        );


    if(
        !key ||
        !expireAt
    ){

        return;
    }


    document
    .getElementById("key")
    .textContent =
        key;


    showResult();


    /*
     * Nếu key còn hạn
     */

    if(
        expireAt > Date.now()
    ){

        document
        .getElementById("getBtn")
        .style.display =
            "none";

        startTimer(
            expireAt
        );

        return;
    }


    /*
     * Nếu đã hết hạn
     */

    const timer =
        document
        .getElementById("timer");


    timer.textContent =
        "KEY ĐÃ HẾT HẠN";

    timer.classList.add(
        "expired"
    );


    document
    .getElementById("result")
    .classList.add(
        "expired"
    );

}


/* =========================
   START
========================= */

restoreKey();

</script>

</body>
</html>
